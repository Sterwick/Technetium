<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <title>Technetium</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="browser">
    <header class="browser-chrome">
      <div class="brand" aria-label="Technetium">
        <span class="brand-mark" aria-hidden="true">T</span>
        <span class="brand-name">Technetium</span>
      </div>
      <nav class="navigation" aria-label="Browser navigation">
        <button class="icon-button" id="back-button" type="button" aria-label="Go back" title="Back" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>
        </button>
        <button class="icon-button" id="forward-button" type="button" aria-label="Go forward" title="Forward" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <button class="icon-button" id="refresh-button" type="button" aria-label="Refresh page" title="Refresh">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M5.6 9a7 7 0 0 1 11.6-2L20 12M4 12l2.8 5a7 7 0 0 0 11.6-2"/></svg>
        </button>
        <form class="address-form" id="address-form" autocomplete="off">
          <span class="security-icon" aria-hidden="true">
            <svg viewBox="0 0 20 20"><path d="M5.5 8V6a4.5 4.5 0 0 1 9 0v2"/><rect x="4" y="8" width="12" height="9" rx="2"/><path d="M10 11v3"/></svg>
          </span>
          <input id="address-input" type="text" inputmode="url" spellcheck="false"
                 placeholder="Search or enter a website address" aria-label="Address">
          <button class="go-button" type="submit" aria-label="Go to address">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </button>
        </form>
      </nav>
      <div class="chrome-spacer" aria-hidden="true"></div>
    </header>

    <div class="page-status" aria-live="polite">
      <span class="loading-track"><span id="loading-bar"></span></span>
      <span id="status-label">Ready</span>
      <span class="current-address" id="current-address">Start browsing</span>
    </div>

    <section class="viewport" aria-label="Website">
      <div class="welcome" id="welcome">
        <div class="welcome-mark" aria-hidden="true">T</div>
        <p class="eyebrow">YOUR PRIVATE WINDOW TO THE WEB</p>
        <h1>Browse with <span>Technetium.</span></h1>
        <p class="welcome-copy">Enter a web address above to get started. Pages are fetched through your local Technetium proxy.</p>
        <form class="welcome-search" id="welcome-form" autocomplete="off">
          <input id="welcome-input" type="text" inputmode="url" placeholder="Try example.com" aria-label="Search or enter a website address">
          <button type="submit">Go <span aria-hidden="true">→</span></button>
        </form>
        <div class="privacy-note"><span aria-hidden="true">●</span> Websites run in an isolated, restricted page</div>
      </div>
      <iframe id="page-frame" title="Website content" sandbox="allow-scripts" hidden></iframe>
      <div class="error-view" id="error-view" role="alert" hidden>
        <div class="error-icon" aria-hidden="true">!</div>
        <p class="eyebrow">THIS PAGE DIDN'T LOAD</p>
        <h2 id="error-title">Unable to reach this website</h2>
        <p id="error-message"></p>
        <button class="retry-button" id="retry-button" type="button">Try again</button>
      </div>
    </section>
  </main>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
